name: React Native CI

on:
  push:
    branches: [react-native]
  pull_request:
    branches: [react-native]

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx expo export --platform android
