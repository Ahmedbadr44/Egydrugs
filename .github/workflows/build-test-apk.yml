name: Build and publish test APK

on:
  push:
    branches: [react-native]
    paths:
      - App.js
      - app.json
      - package.json
      - src/**
      - assets/egymeds-seed.db
      - metro.config.js
      - babel.config.js
      - .github/workflows/build-test-apk.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out React Native project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java for Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          test -x "$ANDROID_HOME/platform-tools/adb" || test -x "$ANDROID_SDK_ROOT/platform-tools/adb"

      - name: Install JavaScript dependencies
        run: npm install

      - name: Verify drug-search tests
        run: npx --yes tsx --test src/search/drugSearch.test.ts

      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: EgyMeds-test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish public download link for friend testing
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          TAG="egymeds-test-${RUN_NUMBER}"
          gh release create "$TAG" "$APK" \
            --repo "$REPO" \
            --target "$SHA" \
            --title "EgyMeds Test APK #${RUN_NUMBER}" \
            --notes "نسخة تجريبية للتثبيت اليدوي وإرسالها للمختبرين. ليست إصدار المتجر الرسمي.\n\nBuilt from commit ${SHA}."
